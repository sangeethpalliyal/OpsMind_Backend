server: {port: 8083}
spring:
  application: {name: deployment-service}
  kafka: {bootstrap-servers: localhost:9092, consumer: {group-id: opsmind-deployment, auto-offset-reset: earliest, key-deserializer: org.apache.kafka.common.serialization.StringDeserializer, value-deserializer: org.apache.kafka.common.serialization.StringDeserializer}}
eureka: {client: {serviceUrl: {defaultZone: http://localhost:8761/eureka/}}}
management: {endpoints: {web: {exposure: {include: health,info}}}}
